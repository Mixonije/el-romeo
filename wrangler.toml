# El Romeo on Cloudflare Workers: static pages from ./public, API + admin guard in worker/index.js, data in D1.
name = "el-romeo"
account_id = "413b71fcd139fd816f2b60aad9ac38b7" # personal account (mihajlostojanovic0606@gmail.com)
main = "worker/index.js"
compatibility_date = "2026-05-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first only for the API and the admin pages; every other file is served straight from the edge.
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "el-romeo"
database_id = "15e289ca-b83c-47dd-a387-83c15a673257"
migrations_dir = "migrations"

# Attempt limits per visitor IP (period must be 10 or 60 seconds).
[[ratelimits]]
name = "LIMIT_BOOK"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_LOOKUP"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMIT_LOGIN"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LIMIT_READ"
namespace_id = "1004"
simple = { limit = 120, period = 60 }

[observability]
enabled = true
